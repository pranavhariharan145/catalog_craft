<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CatalogCraft{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { background: #2c3e50; color: #fff; padding: 1rem 2rem; }
        header a { color: #fff; text-decoration: none; font-weight: bold; }
        main { padding: 2rem; max-width: 900px; margin: auto; }
        .card { background: white; border: 1px solid #ddd; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
        .btn { display: inline-block; background: #3498db; color: white; padding: 0.5rem 1rem; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #2980b9; }
        footer { text-align: center; padding: 1rem; color: #777; margin-top: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>CatalogCraft</h1>
        <nav><a href="{% url 'item_list' %}">Home</a></nav>
    </header>

    <main>
        {% block content %}
        <!-- Child templates will insert content here -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; CatalogCraft System</p>
    </footer>
</body>
</html>
